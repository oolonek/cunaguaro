[package]
name = "cunaguaro"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json", "query"] }
rusqlite = "0.37"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
